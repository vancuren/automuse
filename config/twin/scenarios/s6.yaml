# S6 (Tier 3): heavy drift. Smooth, low-texture concrete (poor optical flow) and three times the
# default drift, with the S1 walker.
name: s6
description: S1's walker over smooth concrete with heavy optical-flow drift.
world:
  ground: {kind: concrete, size_m: 60, texture: 0.1}
  drift: 3.0
  bounds: [-6.5, -2.5, 6.5, 10.5]
  sky: day
  sun: {azimuth_deg: 135, elevation_deg: 50}
  walls:
    - {x1: -7, y1: 11, x2: 7, y2: 11, height: 3.2, color: "#d9cdb4", kind: house}
    - {x1: -7, y1: -3, x2: -7, y2: 11, height: 1.7, color: "#8b6a48", kind: fence}
    - {x1: 7, y1: -3, x2: 7, y2: 11, height: 1.7, color: "#8b6a48", kind: fence}
    - {x1: -7, y1: -3, x2: 7, y2: -3, height: 1.7, color: "#8b6a48", kind: fence}
  trees:
    - {x: -5.2, y: 8.6, height: 4.6, radius: 1.5}
drone: {x: 0.0, y: 0.0, yaw_deg: 0.0}
actors:
  - id: walker_blue
    kind: person
    label: person in blue shirt
    colors: {shirt: "#1f4fc4", pants: "#b8a582", skin: "#c58c6d", hair: "#2b1d14", shoes: "#2a2a2a"}
    height_m: 1.76
    speed_mps: 0.3
    mode: loop
    pause_s: 1.5
    start_s: 2.0
    path: [[-2.4, 4.0], [2.4, 4.4], [2.0, 6.6], [-2.0, 6.2]]
