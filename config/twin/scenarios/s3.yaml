# S3: a green RC car laps a small private track; a walker strolls behind it (PLAN.md 4.2).
# A parked full-size red car is a look-alike distractor for "green car".
name: s3
description: A green RC car drives laps on a private oval track while a person in a yellow shirt walks past.
world:
  ground: {kind: grass, size_m: 60, texture: 0.8}
  bounds: [-6.5, -2.5, 6.5, 10.5]
  sky: day
  sun: {azimuth_deg: 160, elevation_deg: 55}
  track: {cx: 0.0, cy: 3.5, rx: 1.8, ry: 1.0, width: 0.55, samples: 72}
  walls:
    - {x1: -7, y1: 11, x2: 7, y2: 11, height: 3.2, color: "#e2d3c0", kind: house}
    - {x1: -7, y1: -3, x2: -7, y2: 11, height: 1.7, color: "#8b6a48", kind: fence}
    - {x1: 7, y1: -3, x2: 7, y2: 11, height: 1.7, color: "#8b6a48", kind: fence}
    - {x1: -7, y1: -3, x2: 7, y2: -3, height: 1.7, color: "#8b6a48", kind: fence}
  trees:
    - {x: -5.4, y: 9.0, height: 4.8, radius: 1.5}
    - {x: 5.8, y: 4.0, height: 4.2, radius: 1.3}
  props:
    - {kind: sign, x: -2.9, y: 2.6, heading_deg: 160, text: "PRIVATE TRACK"}
    - {kind: cone, x: 2.4, y: 2.8}
    - {kind: cone, x: -2.4, y: 5.8}
drone: {x: 0.0, y: 0.0, yaw_deg: 0.0, cam_tilt_deg: -14}
actors:
  - id: rc_car_green
    kind: car
    label: green car
    colors: {paint: "#1e9e3a"}
    size_m: [0.46, 0.25, 0.17]
    speed_mps: 0.3
    path: track
    start_s: 1.0
  - id: walker_yellow
    kind: person
    label: person in yellow shirt
    colors: {shirt: "#f0c419", pants: "#34465f", skin: "#c58c6d", hair: "#2b1d14", shoes: "#2a2a2a"}
    height_m: 1.70
    speed_mps: 0.25
    mode: pingpong
    pause_s: 2.0
    start_s: 4.0
    path: [[-3.6, 7.6], [3.6, 7.6]]
  - id: parked_car_red
    kind: car
    label: red car
    colors: {paint: "#b3201c"}
    size_m: [4.3, 1.8, 1.45]
    speed_mps: 0.0
    heading_deg: 90
    path: [[4.4, 9.2]]
