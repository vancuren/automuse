# S5 (Tier 3): the subject leaves the frame. The walker heads far to the right (beyond the
# camera's 37.5-degree half field of view unless the drone turns), waits, and walks back.
name: s5
description: The walker in the blue shirt walks out of the camera's view to the right, waits, and comes back.
world:
  ground: {kind: grass, size_m: 60, texture: 0.9}
  bounds: [-6.5, -2.5, 6.5, 10.5]
  sky: day
  sun: {azimuth_deg: 200, elevation_deg: 50}
  walls:
    - {x1: -7, y1: 11, x2: 7, y2: 11, height: 3.2, color: "#cfd6dc", kind: house}
    - {x1: -7, y1: -3, x2: -7, y2: 11, height: 1.7, color: "#7d5f43", kind: fence}
    - {x1: 7, y1: -3, x2: 7, y2: 11, height: 1.7, color: "#7d5f43", kind: fence}
    - {x1: -7, y1: -3, x2: 7, y2: -3, height: 1.7, color: "#7d5f43", kind: fence}
  trees:
    - {x: -5.6, y: 9.2, height: 5.0, radius: 1.6}
drone: {x: 0.0, y: 0.0, yaw_deg: 0.0}
actors:
  - id: walker_blue
    kind: person
    label: person in blue shirt
    colors: {shirt: "#1f4fc4", pants: "#262626", skin: "#8d5a3b", hair: "#120c08", shoes: "#e8e8e8"}
    height_m: 1.72
    speed_mps: 0.3
    mode: pingpong
    pause_s: 6.0
    start_s: 1.0
    path: [[0.0, 4.0], [6.0, 2.0]]
