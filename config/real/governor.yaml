# REAL-DRONE calibration of config/governor.yaml (created 2026-11-04 16:01 for our unit's Lewei board).
# Identical to config/governor.yaml except the values tagged [measured ...] or [set ...]. Never for the twin.
# Safety governor parameters (loaded by mhd.governor.config.load_governor_config).
#
# These are defaults for FIRST FLIGHTS. Values marked [Session A] or [Session B] are guesses until
# measured on the drone (PLAN.md section 6). Unknown keys are an error, so a typo cannot silently
# fall back to a default.
#
# Units: times in seconds; normalized sticks are -1..1; "counts" are wire offsets from the 128 center
# (the wire byte is 128 + offset, 0..255). The X69 speed tier is pinned at index 2 (scale 1.0), so
# the counts below are exactly what goes on the wire.

rc_rate_hz: 25              # FlightController rate for x69_lg; informational (land re-assert is time-based)

wire:
  full_scale_counts: 127    # normalized 1.0 = 127 counts on BOTH sides (symmetric: 1..255, never 0)
  sign:                     # per-axis sign applied before caps. Flip to -1 if Session B shows an axis reversed.
    throttle: 1
    yaw: 1
    pitch: 1
    roll: 1
  deadband_counts:          # firmware deadband compensation in counts, autopilot output only [Session B]
    throttle: 0             # u -> sign(u) * (deadband + |u|*127) when |u| > deadband_threshold
    yaw: 0
    pitch: 0
    roll: 0
  deadband_threshold: 0.01  # autopilot |u| below this is sent as exact center (no compensation)

caps:                       # max |offset| in counts, applied after sign and deadband compensation
  autopilot:                # PLAN 4.4 first-flight caps: yaw 38 (0.30), pitch 32 (0.25), roll 0, throttle 0
    throttle: 0
    yaw: 38
    pitch: 32
    roll: 0
  human:                    # manual flying from the UI (keyboard, gamepad); 64 counts = 0.5
    throttle: 64
    yaw: 64
    pitch: 64
    roll: 64

slew:
  autopilot_per_s: 1.0      # autopilot sticks move at most 1.0 normalized unit per second.
                            # Safety neutralization always bypasses the slew limiter.

human:
  stale_s: 0.25             # human sticks count as zero this long after the last nonzero message
  deadzone: 0.05            # |axis| below this is zero, so gamepad drift is not "input"
  inc_ramp_per_s: 1.0       # 'inc' (keyboard) mode: stick ramps toward +/- the human cap at this rate;
                            # release (all-zero message or staleness) is an immediate zero

heartbeat:                  # UI heartbeat ({"type":"hb","client":"ui"} at 5 Hz from a Web Worker). Real mode:
                            # only that message counts. Twin: any /ws message counts (legacy UI).
  neutral_after_s: 1.5      # missing this long: all sticks neutral (hover); max 3
  land_after_s: 5.0         # missing this long while flying: safety landing; max 10


video:                      # frame lag = (now - capture_ms) minus the SESSION minimum of (receive - capture)
  neutral_lag_s: 0.7        # autopilot neutral (the human keeps control for line-of-sight flying); max 1.0
  land_lag_s: 2.0           # safety landing; max 3.0
  floor_cap_s: 1.5          # the floor (best-case pipeline latency since start) never excuses more than this.
                            # It is a session minimum, so it never rises: a latency creep or a lasting rise
                            # shows up as lag (review fix; it was a 10 s sliding minimum).

observation:                # obs lag = (now - capture_ms of the newest SubjectObs) minus its session minimum
  stale_min_s: 0.4          # autopilot neutral above max(stale_min_s, stale_periods x measured period); max 1.0
  stale_periods: 2.5
  floor_cap_s: 2.0

autopilot:
  max_step_ms: 5.0          # an autopilot step slower than this sets the "autopilot_slow" health flag
  fault_neutral_s: 1.0      # after an autopilot exception, its output stays neutral at least this long

takeoff:
  hold_s: 4.0               # TAKING_OFF holds neutral sticks at least this long before AIRBORNE
  packets: 1                # takeoff flag (0x01) is sent in this many consecutive packets
  require_heartbeat: true   # takeoff refused unless the UI heartbeat is fresh (bypass: twin_headless_bypass).
                            # false is refused in real mode.

landing:
  reassert_per_s: 25        # [set 2026-11-04 16:01: Session A 15:54, LAND pulsed 5/s did NOT stop the Lewei board's motors;
                            # 0x80 held in every packet did (props-off bench test 13:22). 25 = every RC packet.]
  throttle_ramp: false      # Fallback if Session A shows 0x80 does not land: while LANDING, also ramp the
                            # throttle stick down (the land flag is still re-asserted). Tune in the twin,
                            # check at low height in Session B before relying on it.
  throttle_down: 0.35       # normalized throttle reached by the ramp (0.35 x 127 = 44 counts below center)
  throttle_ramp_s: 1.0      # seconds from center to throttle_down

estop:
  rearm_after_reset: true   # real mode: after estop_reset, ARM must be typed again before takeoff

arming:
  phrase: "ARM"             # real mode: {"type":"cmd","command":"arm","arm_phrase":"ARM"} (exact, after strip)

flight_timer:               # per battery pack, persisted to $MHD_LOGS/flight_timer.json
  warn_s: 300               # 5:00: warning flag and event
  land_s: 390               # 6:30: automatic landing (max 600)
  refire_after_s: 20        # an explicit resume cancels the timer landing; it fires again 20 s of flight later

wrong_way:                  # PLAN 4.5 step 5, plus pitch and frozen-box checks (review fixes). All latch a
  enabled: true             # hover ("wrong_way" flag) until the operator presses Resume.
  window_thetas: 1.5        # compare bearing change over 1.5 x theta (theta from config/autopilot.yaml)
  min_change_rad: 0.15      # both observed and predicted change must exceed this, with opposite signs
  pitch_enabled: true       # forward commanded over the window but the box shrank (or back and it grew)
  pitch_min_cmd: 0.08       # ... when the mean |applied pitch| over the window is at least this (10 counts)
  pitch_min_size_change: 0.06   # ... and the MEDIAN |log(width ratio)| is at least this (6 %)
  pitch_window_thetas: 2.0  # pitch window (gait-robust: medians over +/- pitch_median_s at each end)
  pitch_median_s: 0.3
  pitch_persist_s: 0.5      # must persist this long before it latches
  pitch_min_cap_frac: 0.0   # 0 = no "near the cap" requirement (above 0 it misses a slow or deadbanded
                            # reversed plant: review 2026-11-04, tests/gov/test_reversed_sign_closed_loop.py)
  pitch_check_backward: true   # backing while the box grows (reversed sign: "back" flies toward them):
                            # no autopilot backing for the rest of the mission (no hover latch)
  yaw_min_ratio: 0.3        # yaw: observed change at least this fraction of the predicted one
                            # (low until Session B measures K: still latches at 0.7 x K, 6-count deadband)
  pitch_probe_settle_s: 1.0 # pitch probe: before latching, hold pitch at 0 (yaw still tracks) and compare the
  pitch_probe_window_s: 0.0 # subject's recession over this window with the rate before. Receding FASTER by
  pitch_probe_margin: 0.02  # this much (fraction of the distance per s) = it outpaces a correct drone:
  pitch_probe_max_clears: 2 # follow again, at most this often per mission. Otherwise latch. Window 0 = off:
                            # OFF (review 3, logs/review3/): a subject that starts walking, turns or stops
                            # during the hold fools it into resuming under a reversed sign.
  frozen_box_s: 2.0         # the very same box (within frozen_box_px) for this long while we turned at
  frozen_box_px: 0.5        # least frozen_box_min_turn_rad: stuck tracker or repeating camera frame
  frozen_box_min_turn_rad: 0.15

mission:                    # A follow Mission releases a pause only if it was spoken after the last
                            # pause / land / E-stop / takeoff: spoken_at = arrival - latency_ms - slack.
  utterance_slack_s: 3.0    # ASR and transport time that Mission.latency_ms does not include
  max_latency_s: 30.0       # a latency_ms that is not finite, negative or above this counts as this

tilt:
  max_hold_s: 3.0           # a tilt_up/tilt_down command stops by itself after this long (UI may die mid-press)

faults:
  land_after_s: 2.0         # tick exceptions for this long in a row: the fallback also re-asserts land

twin_headless_bypass: false # TWIN ONLY: skip UI-heartbeat checks for headless test runs.
                            # The governor refuses to start in real mode when this is true, and also
                            # when takeoff.require_heartbeat is false.

tick_log: true              # per-tick JSON lines in $MHD_LOGS/control-*.jsonl (written off the RC thread)
