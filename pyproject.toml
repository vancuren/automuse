[project]
name = "mhd-core"
version = "0.1.0"
description = "Backend, safety governor, autopilot, digital twin, and training data for the X69 follow drone"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart",
  "python-dotenv",
  "numpy>=2",
  "opencv-contrib-python==5.0.0.93",
  "pydantic>=2.7",
  "websockets>=13",
  "httpx>=0.27",
  "openai>=1.40",
  "pyyaml",
  "playwright>=1.55",
  "pytest>=8",
  "pillow",
  "matplotlib",
]

[tool.uv]
package = false
override-dependencies = [
  "opencv-python; sys_platform == 'never'",
  "opencv-python-headless; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
